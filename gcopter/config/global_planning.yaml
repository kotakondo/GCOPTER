/**:
  ros__parameters:
    MapTopic:                   '/voxel_map'
    TargetTopic:                '/goal_pose'
    DilateRadius:               0.5
    VoxelWidth:                 0.25
    MapBound:                   [-20.0, 20.0, -20.0, 20.0, 0.0, 5.0]
    TimeoutRRT:                 3.0
    MaxVelMag:                  2.0
    MaxBdrMag:                  2.1
    MaxTiltAngle:               1.05
    MinThrust:                  2.0
    MaxThrust:                  12.0
    VehicleMass:                0.61
    GravAcc:                    9.8
    HorizDrag:                  0.70
    VertDrag:                   0.80
    ParasDrag:                  0.01
    SpeedEps:                   0.0001
    WeightT:                    1e+2
    ChiVec:                     [1.0e+4, 1.0e+4, 1.0e+4, 1.0e+4, 1.0e+5] # [pos, vel, omega, theta, thrust]
    SmoothingEps:               1.0e-2
    IntegralIntervs:            32
    RelCostTol:                 1.0e-5
    ExportCSVDir:               '/home/kkondo/data/gcopter_csv'
    SampleDt:                   0.01

    # MIGHTY-specific parameters
    MIGHTYJerkWeight:           1.0e-5
    MIGHTYWeightT:              1.0e+2
    MIGHTYPosWeight:            1.0e+4
    MIGHTYVelWeight:            1.0e+4
    MIGHTYOmegaWeight:          1.0e+4
    MIGHTYThetaWeight:          1.0e+4
    MIGHTYThrustWeight:         1.0e+5
    MIGHTYINITI_TURNBF:         30.0 # degrees
    OrientSmoothWeight:         0.0
    TiltBiasWeight:             0.0
    TvarWeight:                 0.0
    TminWeight:                 0.0
    TminPlan:                   0.0

    # Collision checking parameters
    CollisionDt:                0.01

    # safe corridor parameters
    sfc_progress:             3.0
    sfc_range:                7.0

    # time out for optimization [ms]
    opt_timeout_ms:           -1.0   # no decimal point since this will be converted to int. Set to negative value for no timeout

    # L-BFGS parameters
    lbfgs_mem_size:           256 #256
    max_linesearch:           64 #40
    lbfgs_past:               3
    lbfgs_min_step:           1.0e-32
    lbfgs_max_iterations:     0
    lbfgs_g_epsilon:          1.0e-5

    # Use scaled cost and gradient
    use_scaled_cost:          True
